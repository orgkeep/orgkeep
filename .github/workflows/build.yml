# Builds and tests every push to main and every pull request: every module (core, dashboard, theme), and the
# Keycloak image with the theme (built only, never pushed: the Release workflow publishes it).
# The tests start Keycloak and Mailpit with Quarkus Dev Services: the GitHub runners have Docker.
name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the build still running for the previous one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # "build" is the name of the check required by the ruleset of main
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # The core first, then the dashboard (which embeds it) and the theme. Quinoa is disabled in the test profile,
      # but the package phase builds the front (npm run build: TypeScript check, then Vite), with the Node.js version
      # it downloads itself.
      - name: Build and test
        run: mvn -B verify

      # help:evaluate silently prints an error message and exits 0 when the expression does not resolve: checked
      # here, before the image is built, instead of failing only on the FROM line with a build-arg made of this
      # very error message. Also catches a Dockerfile left out of sync with the pom (its default ARG is for a
      # manual `docker build`, see its comment; CI and the release workflow always pass --build-arg).
      - name: Check the Keycloak version against the Dockerfile default
        id: keycloak
        run: |
          kc_version=$(mvn -B -q help:evaluate -Dexpression=keycloak.version -DforceStdout)
          if ! [[ "$kc_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::keycloak.version did not resolve to a version (got '$kc_version')"
            exit 1
          fi
          dockerfile_version=$(sed -n 's/^ARG KEYCLOAK_VERSION=//p' orgkeep-theme/Dockerfile)
          if [ "$dockerfile_version" != "$kc_version" ]; then
            echo "::error::orgkeep-theme/Dockerfile defaults to Keycloak $dockerfile_version, but keycloak.version of the pom is $kc_version: keep them in sync"
            exit 1
          fi
          echo "version=$kc_version" >> "$GITHUB_OUTPUT"

      - name: Build the Keycloak image
        run: >-
          docker build
          --build-arg KEYCLOAK_VERSION=${{ steps.keycloak.outputs.version }}
          -t orgkeep-keycloak:ci orgkeep-theme
