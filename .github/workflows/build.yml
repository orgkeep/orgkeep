# Builds and tests every push to main and every pull request: every module (core, dashboard, theme), and the
# Keycloak image with the theme (built only, never pushed: the Release workflow publishes it).
# The tests start Keycloak and Mailpit with Quarkus Dev Services: the GitHub runners have Docker.
name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the build still running for the previous one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # "build" is the name of the check required by the ruleset of main
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # The core first, then the dashboard (which embeds it) and the theme. Quinoa is disabled in the test profile,
      # but the package phase builds the front (npm run build: TypeScript check, then Vite), with the Node.js version
      # it downloads itself.
      - name: Build and test
        run: mvn -B verify

      - name: Build the Keycloak image
        run: docker build -t orgkeep-keycloak:ci orgkeep-theme
