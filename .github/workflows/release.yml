# Publishes a release when a version tag is pushed (v0.1.0):
# the image ghcr.io/orgkeep/orgkeep-core:<version> and :latest, for amd64 and arm64, then the GitHub Release.
# The tag must match the version of the pom (v0.1.0 for 0.1.0): see RELEASE.md for the whole procedure.
# Run it by hand (Actions > Release > Run workflow) to publish an existing tag again, with the workflow of main:
# after fixing this file, without moving the tag.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to publish again, like v1.2.3'
        required: true

permissions:
  contents: write   # the GitHub Release
  packages: write   # the image on ghcr.io

env:
  # The pushed tag, or the one given by hand
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Check that the tag matches the version of the pom
        run: |
          version=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match the version of the pom ($version)"
            exit 1
          fi

      # QEMU runs the arm64 steps of the Dockerfile on the amd64 runner; buildx builds both platforms in one image
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same build as by hand (mvn package -Pdocker), with the tests: Quarkus builds the image with buildx and pushes
      # it, labels included (application.properties). The revision is the commit of the tag, not the one of main
      # when the workflow is run by hand.
      - name: Build, test and push the image
        run: >-
          mvn -B package -Pdocker
          -Dquarkus.container-image.push=true
          -Dquarkus.container-image.additional-tags=latest
          -Dquarkus.docker.buildx.platform=linux/amd64,linux/arm64
          -Dquarkus.container-image.labels.\"org.opencontainers.image.revision\"=$(git rev-parse HEAD)

      # Run again by hand, the release may already exist
      - name: Create the GitHub Release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --verify-tag --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
