# Publishes a release when a version tag is pushed (v0.1.0):
# the image ghcr.io/orgkeep/orgkeep-keycloak:<version> and :latest, for amd64 and arm64, then the GitHub Release with
# the jar of the theme (for /opt/keycloak/providers). The tag must match the version of the pom (v0.1.0 for 0.1.0):
# see RELEASE.md for the whole procedure.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # the GitHub Release
  packages: write   # the image on ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Check that the tag matches the version of the pom
        id: version
        run: |
          version=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version of the pom ($version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the jar
        run: mvn -B package

      # QEMU runs the arm64 steps of the Dockerfile on the amd64 runner; buildx builds both platforms in one image
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The labels are in the Dockerfile, except the commit (revision), which replaces the one of the Keycloak image
      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/orgkeep/orgkeep-keycloak:${{ steps.version.outputs.version }}
            ghcr.io/orgkeep/orgkeep-keycloak:latest

      - name: Create the GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes target/orgkeep-theme.jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
