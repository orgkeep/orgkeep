# Publishes a release when a version tag is pushed (v0.1.0):
# the image ghcr.io/orgkeep/orgkeep:<version> and :latest (core + dashboard), for amd64 and arm64, then the GitHub
# Release. The tag must match the version of the pom (v0.1.0 for 0.1.0), and orgkeep-core must have the same tag:
# the image embeds the core of that release, not the one of main. See RELEASE.md for the whole procedure.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # the GitHub Release
  packages: write   # the image on ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check out orgkeep-core at the same tag
        uses: actions/checkout@v5
        with:
          repository: orgkeep/orgkeep-core
          ref: ${{ github.ref_name }}
          path: orgkeep-core

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Check that the tag matches the version of the pom
        run: |
          version=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version of the pom ($version)"
            exit 1
          fi

      # The core was tested by its own release
      - name: Install orgkeep-core
        run: mvn -B install -DskipTests
        working-directory: orgkeep-core

      # QEMU runs the arm64 steps of the Dockerfile on the amd64 runner; buildx builds both platforms in one image
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same build as by hand (mvn package -Pdocker), with the tests: Quarkus builds the image with buildx and pushes
      # it, labels included (application.properties)
      - name: Build, test and push the image
        run: >-
          mvn -B package -Pdocker
          -Dquarkus.container-image.push=true
          -Dquarkus.container-image.additional-tags=latest
          -Dquarkus.docker.buildx.platform=linux/amd64,linux/arm64
          -Dquarkus.container-image.labels.\"org.opencontainers.image.revision\"=$GITHUB_SHA

      - name: Create the GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
