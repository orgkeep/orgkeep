# The dashboard embeds orgkeep-core: one application, the API of the core plus the front.
# The application.properties of the core jar is read too. Where both files set the same key, the value of this
# file wins, but only because of the classpath order: every key that differs from the core is set here explicitly.
quarkus.http.port=8284

# The API of the core lives under /api (quarkus.rest.path=/api, set by the core and repeated here),
# the dashboard adds /api/me, /api/info and /api/auth/*. Quinoa serves the front on every other path,
# so the front calls the API on the same origin (no CORS).
quarkus.rest.path=/api
# React Router handles the front paths (/organisations...): Quinoa answers index.html for them
quarkus.quinoa.enable-spa-routing=true

# --- Keycloak ---
# Dev Services start Keycloak in dev and test, with the settings of the core (port 8280, realm demo in dev,
# realm acme in test, created by OnPremiseBootstrap).

# --- OIDC: two tenants (see auth/DashboardTenantResolver) ---
# Default tenant, the one of the core: bearer tokens of the realm, for the applications of the realm owner.
quarkus.oidc.application-type=service

# Tenant "dashboard": browser login (authorization code flow). Quarkus redirects the browser to the Keycloak login
# page, then keeps the tokens in an encrypted HttpOnly session cookie: the front never sees a token.
quarkus.oidc.dashboard.application-type=web-app
# same realm as the default tenant (set by Dev Services in dev and test, by the core in prod)
quarkus.oidc.dashboard.auth-server-url=${quarkus.oidc.auth-server-url}
quarkus.oidc.dashboard.client-id=orgkeep-dashboard
# In dev, the client is created by the DemoSeeder of the core with this secret; in test, by the tests
%dev,test.quarkus.oidc.dashboard.credentials.secret=dashboard-dev-secret
%prod.quarkus.oidc.dashboard.credentials.secret=${ORGKEEP_DASHBOARD_CLIENT_SECRET}
# Keycloak puts the realm roles in the access token, not in the ID token (the web-app default)
quarkus.oidc.dashboard.roles.source=accesstoken
# The roles are read from the access token, so its signature must be checked too, not only the one of the ID token
# (see auth/SessionOrgRolesAugmentor)
quarkus.oidc.dashboard.authentication.verify-access-token=true
# A fetch of the front (header X-Requested-With: JavaScript) whose session expired gets 499 instead of a redirect
# to Keycloak, which a fetch could not follow: the front then goes back to its login page
quarkus.oidc.dashboard.authentication.java-script-auto-redirect=false
# Lax, not Strict: the browser comes back from Keycloak with a cross-site redirect when Keycloak is on another
# site, and a Strict cookie would be left out of it. The CSRF protection is the header, see auth/CsrfFilter.
quarkus.oidc.dashboard.authentication.cookie-same-site=lax
# Logout: Quarkus intercepts this path, ends the session and the Keycloak session, then redirects to /
quarkus.oidc.dashboard.logout.path=/api/auth/logout
quarkus.oidc.dashboard.logout.post-logout-path=/
quarkus.http.auth.permission.logout.paths=/api/auth/logout
quarkus.http.auth.permission.logout.policy=authenticated

# --- Security headers of the front and the API ---
# Not on /q/ (Swagger UI uses inline scripts), not in dev (the Vite dev server injects an inline script).
# 'unsafe-inline' styles: Mantine sets style attributes and injects its CSS variables in a <style> element.
%prod,test.quarkus.http.filter.security.matches=/(?!q/).*
%prod,test.quarkus.http.filter.security.header."Content-Security-Policy"=default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'
%prod,test.quarkus.http.filter.security.header."X-Content-Type-Options"=nosniff
%prod,test.quarkus.http.filter.security.header."Referrer-Policy"=same-origin

# --- Docker image (mvn package -Pdocker) -> ghcr.io/orgkeep/orgkeep:<project version> ---
# the core alone is ghcr.io/orgkeep/orgkeep-core: the name is set here, the registry and group are the same
quarkus.container-image.registry=ghcr.io
quarkus.container-image.group=orgkeep
quarkus.container-image.name=orgkeep
# OCI labels: GitHub links the package to its repository (and gives it the repository's access rights, not its visibility).
# title, url, documentation and version replace the ones inherited from the OpenJDK image
quarkus.container-image.labels."org.opencontainers.image.source"=https://github.com/orgkeep/orgkeep-dashboard
quarkus.container-image.labels."org.opencontainers.image.title"=orgkeep
quarkus.container-image.labels."org.opencontainers.image.url"=https://orgkeep.org
quarkus.container-image.labels."org.opencontainers.image.documentation"=https://github.com/orgkeep/orgkeep-dashboard
quarkus.container-image.labels."org.opencontainers.image.version"=${quarkus.application.version}
quarkus.container-image.labels."org.opencontainers.image.description"=Orgkeep: multi-tenant B2B on Keycloak, the core API and its dashboard
quarkus.container-image.labels."org.opencontainers.image.licenses"=Apache-2.0

# --- Test ---
# the realm owner created by OnPremiseBootstrap logs in through the browser flow in the tests:
# no password change, and a first and last name (else Keycloak asks to complete the profile)
%test.orgkeep.owner.temporary-password=false
%test.orgkeep.owner.first-name=Alice
%test.orgkeep.owner.last-name=Admin
# no front in the tests: they call the API, npm would only slow them down
%test.quarkus.quinoa.enabled=false

quarkus.quinoa.package-manager-install=true
quarkus.quinoa.package-manager-install.node-version=24.22.0
