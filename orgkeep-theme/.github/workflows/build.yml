# Builds every push to main and every pull request: the jar of the theme, and the Keycloak image with the theme
# (built only, never pushed: the images are published by hand, see the README).
name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the build still running for the previous one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build the jar
        run: mvn -B package

      - name: Build the Keycloak image
        run: docker build -t orgkeep-keycloak:ci .
