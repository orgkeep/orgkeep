# Extends the Account console of Keycloak 26 (a React app): only what its index.ftl reads can change, the logo,
# a stylesheet, the title of the page
parent=keycloak.v3

# white, like the dashboard
darkMode=false
kcDarkModeClass=pf-v5-theme-dark

# the logo of the header, under resources/
logo=/img/orgkeep-banner.png
styles=css/orgkeep.css
title=Account
