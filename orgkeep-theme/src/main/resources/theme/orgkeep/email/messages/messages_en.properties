# Texts of the Orgkeep layout and buttons, prefixed orgkeep to stay apart from the keys of Keycloak.
# The subjects and the other emails keep the texts of Keycloak (theme keycloak, then base).
# Another language without its file falls back to English, through the locales chain of Keycloak.

orgkeepFooter=This email was sent by {0}.
orgkeepLinkFallback=If the button does not work, copy this link into your browser:
orgkeepLinkExpiration=This link expires in {0}.

# The invitation of Orgkeep: execute-actions with UPDATE_PASSWORD only. The subject is shared by every
# execute-actions email and gets no argument (no realm name): "Update Your Account" in Keycloak
executeActionsSubject=Set up your account
orgkeepInvitationTitle=Welcome to {0}
orgkeepInvitationText=An account has been created for you on {0}. Choose your password to sign in.
orgkeepInvitationButton=Choose my password

# Other actions requested by an administrator
orgkeepExecuteActionsTitle=Your {0} account
orgkeepExecuteActionsText=Your administrator asks you to update your {0} account: {1}.
orgkeepExecuteActionsButton=Update my account
orgkeepExecuteActionsIgnore=If you did not expect this email, you can ignore it: nothing will be changed.

orgkeepPasswordResetTitle=Reset your password
orgkeepPasswordResetText=Someone asked to reset the password of your {0} account. If it was you, choose a new password.
orgkeepPasswordResetButton=Choose a new password
orgkeepPasswordResetIgnore=If it was not you, ignore this email: your password stays the same.

orgkeepEmailVerificationTitle=Verify your email
orgkeepEmailVerificationText=Confirm that this address is yours to finish setting up your {0} account.
orgkeepEmailVerificationButton=Verify my email
orgkeepEmailVerificationIgnore=If you did not create this account, ignore this email.
