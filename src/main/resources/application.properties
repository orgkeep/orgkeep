quarkus.http.port=8282

# Every endpoint of the API lives under /api (/api/admin/..., /api/organisations/...): the @Path of the resources
# do not repeat it. orgkeep-dashboard embeds the core and serves its front on every other path.
quarkus.rest.path=/api

# --- Keycloak Dev Services (dev & test) ---
# The realm is created by OnPremiseBootstrap, not by Dev Services: OIDC only points at it.
# Must match orgkeep.realm-name below.
%dev.quarkus.keycloak.devservices.realm-name=demo
%test.quarkus.keycloak.devservices.realm-name=acme
%dev,test.quarkus.keycloak.devservices.create-realm=false
# Ports in dev: Keycloak 8280, core alone 8282, dashboard (core + front) 8284
%dev.quarkus.keycloak.devservices.port=8280
# Login theme of Orgkeep (module orgkeep-theme, checked out next to this one), mounted from its sources: Keycloak
# runs start-dev, which does not cache themes, so a change of its CSS shows at the next page load.
# user.dir: the module started with mvn quarkus:dev, orgkeep-core or orgkeep-dashboard
%dev.quarkus.keycloak.devservices.resource-aliases.orgkeep-theme=${user.dir}/../orgkeep-theme/src/main/resources/theme/orgkeep
%dev.quarkus.keycloak.devservices.resource-mappings.orgkeep-theme=/opt/keycloak/themes/orgkeep
# Keycloak keeps a gzip copy of every CSS and JS file it serves, even in start-dev: it would serve the first version
# of the CSS of the theme until restarted. Not compressed in dev (the default excludes only the images)
%dev.quarkus.keycloak.devservices.container-env.KC_SPI_RESOURCE_ENCODING__GZIP__EXCLUDED_CONTENT_TYPES=image/png image/jpeg text/css application/javascript

# --- OIDC: the API accepts bearer tokens of the application realm ---
# In dev & test, Dev Services set auth-server-url to <dev keycloak>/realms/<devservices realm-name>.
quarkus.oidc.application-type=service
%prod.quarkus.oidc.auth-server-url=${KEYCLOAK_URL}/realms/${orgkeep.realm-name}

# --- Keycloak admin client ---
# In dev & test, Dev Services wire it to the dev Keycloak (master realm, admin/admin).
%prod.quarkus.keycloak.admin-client.server-url=${KEYCLOAK_URL}
%prod.quarkus.keycloak.admin-client.realm=master
%prod.quarkus.keycloak.admin-client.client-id=admin-cli
%prod.quarkus.keycloak.admin-client.username=${KEYCLOAK_ADMIN_USER:admin}
%prod.quarkus.keycloak.admin-client.password=${KEYCLOAK_ADMIN_PASSWORD:admin}

# --- OpenAPI / Swagger UI ---
# Swagger UI is packaged in the image too (build time) but disabled in prod (runtime):
# QUARKUS_SWAGGER_UI_ENABLE=true turns it on, as docker-compose.demo.yaml does
quarkus.swagger-ui.always-include=true
%prod.quarkus.swagger-ui.enable=false
quarkus.smallrye-openapi.info-title=Orgkeep Core API
quarkus.smallrye-openapi.info-version=${quarkus.application.version}
quarkus.smallrye-openapi.info-description=Organisation management on top of Keycloak
# "Authorize" button of Swagger UI: paste an access token of the application realm
quarkus.smallrye-openapi.security-scheme=jwt
# Dev: username / password login instead (OAuth2 password flow, see web/openapi/SwaggerLoginFilter)
# In the image: ORGKEEP_SWAGGER_UI_LOGIN=true + ORGKEEP_SWAGGER_UI_AUTH_SERVER_URL (Keycloak as seen by the browser)
%dev.orgkeep.swagger-ui.login=true
# build time settings of Swagger UI, harmless without the login: set for every profile
quarkus.swagger-ui.oauth-client-id=swagger-ui
# keep the token across page reloads
quarkus.swagger-ui.persist-authorization=true

# --- Docker image (mvn package -Pdocker) -> orgkeep/orgkeep-core:<project version> ---
quarkus.container-image.group=orgkeep
quarkus.container-image.name=orgkeep-core

# --- Orgkeep ---
%dev,test.orgkeep.mode=on-prem

# Dev: demo data, ready-to-use accounts for manual testing (Swagger UI, Bruno, Postman)
# The Docker image gets the same values from docker-compose.demo.yaml (environment variables).
%dev.orgkeep.realm-name=demo
# realm owner: realm-owner / password, no password change at first login
%dev.orgkeep.owner.email=realm-owner@demo.test
%dev.orgkeep.owner.username=realm-owner
%dev.orgkeep.owner.password=password
%dev.orgkeep.owner.temporary-password=false
%dev.orgkeep.owner.first-name=Alice
%dev.orgkeep.owner.last-name=Martin
# organisation acme with its owner org-owner / password (see DemoSeeder)
%dev.orgkeep.demo.enabled=true
# the theme mounted by Dev Services above
%dev.orgkeep.login-theme=orgkeep

# Emails of the realm (invitations): Mailpit of compose-devservices.yml, seen from the Keycloak container
# Read them on http://localhost:8025
%dev,test.orgkeep.smtp.host=mailpit
%dev,test.orgkeep.smtp.port=1025
%dev,test.orgkeep.smtp.from=no-reply@orgkeep.test
# tests may run while the dev mode is up: they share its Mailpit instead of starting a second one on port 8025
%test.quarkus.compose.devservices.reuse-project-for-tests=true

# Test: no demo data, each test class works in its own throwaway realm (TestRealm)
%test.orgkeep.realm-name=acme
%test.orgkeep.owner.email=admin@acme.com
%test.orgkeep.owner.password=changeme
%test.orgkeep.owner.first-name=Alice
%test.orgkeep.owner.last-name=Admin
