quarkus.http.port=8284

# All REST endpoints live under /api. Quinoa serves the front on every other path,
# so the front calls its backend on the same origin (no CORS).
quarkus.rest.path=/api
# React Router handles the front paths (/organisations...): Quinoa answers index.html for them
quarkus.quinoa.enable-spa-routing=true

# --- Keycloak ---
# No Dev Services: in dev the dashboard uses the Keycloak started by orgkeep-core (port 8180, realm demo),
# so the core must be running (mvn quarkus:dev in orgkeep-core) before the dashboard.
quarkus.keycloak.devservices.enabled=false
%dev.orgkeep.realm-name=demo

# --- OIDC: browser login (authorization code flow) ---
# web-app: Quarkus redirects the browser to the Keycloak login page, then keeps the tokens in an encrypted
# session cookie. The front never sees a token (BFF pattern).
quarkus.oidc.application-type=web-app
# In dev, the client is created by the DemoSeeder of orgkeep-core, with this secret
quarkus.oidc.client-id=orgkeep-dashboard
%dev.quarkus.oidc.auth-server-url=http://localhost:8180/realms/${orgkeep.realm-name}
%dev.quarkus.oidc.credentials.secret=dashboard-dev-secret
%prod.quarkus.oidc.auth-server-url=${KEYCLOAK_URL}/realms/${orgkeep.realm-name}
%prod.quarkus.oidc.credentials.secret=${ORGKEEP_DASHBOARD_CLIENT_SECRET}
# Keycloak puts the realm roles in the access token, not in the ID token (the web-app default)
quarkus.oidc.roles.source=accesstoken
# Logout: Quarkus intercepts this path, ends the session and the Keycloak session, then redirects to /
quarkus.oidc.logout.path=/api/auth/logout
quarkus.oidc.logout.post-logout-path=/
quarkus.http.auth.permission.logout.paths=/api/auth/logout
quarkus.http.auth.permission.logout.policy=authenticated
# No tests need a Keycloak yet
%test.quarkus.oidc.tenant-enabled=false

# --- Core API (see core/OrganisationsClient) ---
# The access token of the user is forwarded to the core (@AccessToken), so both must trust the same realm.
quarkus.rest-client.core.url=http://localhost:8282
%prod.quarkus.rest-client.core.url=${ORGKEEP_CORE_URL}

quarkus.quinoa.package-manager-install=true
quarkus.quinoa.package-manager-install.node-version=24.22.0
