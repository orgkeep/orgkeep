# Extends the default email theme of Keycloak: its texts (messages, in every language of Keycloak) are kept,
# html/template.ftl puts them in the Orgkeep layout. The emails with a link get a button (html/*.ftl below).
parent=keycloak

# The colors of the layout, written inline in the HTML: mail clients ignore most stylesheets
primaryColor=#228be6
textColor=#212529
dimmedColor=#868e96
borderColor=#dee2e6
backgroundColor=#f8f9fa
